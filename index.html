<style>
  :root{
    --gold:#ffd700;
    --warm:#ffebd2;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Nanum Gothic', serif;
    background:#090a0f;
    color:#fff;
  }

  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% 115%, rgba(255,186,120,.16) 0%, transparent 55%),
      radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 72%);
  }

  .sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .moon{
    position:fixed;
    top:11%;
    right:16%;
    width:64px;
    height:64px;
    border:0;
    padding:0;
    border-radius:50%;
    background:#f3ead2;
    opacity:.32;
    box-shadow:0 0 60px 18px rgba(255,240,210,.14);
    cursor:pointer;
    z-index:8;
  }
  .moon:hover{opacity:.5;}
  .moon:focus-visible{outline:1px solid rgba(255,235,210,.45);}

  .horizon{
    position:absolute;
    left:0;right:0;bottom:0;
    height:28%;
    background:linear-gradient(to top, rgba(255,176,110,.12), transparent);
    opacity:.7;
  }

  .stars{
    position:absolute;
    top:0;left:0;
    width:2px;height:2px;
    background:transparent;
    border-radius:50%;
  }
  #stars-a{animation:drift 80s linear infinite;}
  #stars-b{animation:drift 140s linear infinite;}
  #stars-c{animation:drift 220s linear infinite;}
  #stars-a:after,#stars-b:after,#stars-c:after{
    content:"";
    position:absolute;
    top:2000px;
    width:2px;height:2px;
    border-radius:50%;
  }

  .shooting{
    position:absolute;
    width:90px;height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,.9), transparent);
    opacity:0;
    transform:rotate(-28deg);
    filter:drop-shadow(0 0 4px #fff);
  }
  .shooting.go{
    animation:shoot 1.1s ease-out forwards;
  }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:1;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 1.1s ease, visibility 1.1s;
  }
  .screen.on{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  .to-you{
    font-size:.78rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(255,235,210,.45);
    margin-bottom:18px;
    opacity:0;
    animation:textFadeIn 2s forwards .2s;
  }

  .message-box{
    text-align:center;
    line-height:2.4;
    font-size:1.35rem;
    padding:28px 20px 8px;
    max-width:90%;
    width:620px;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }

  .line{
    display:inline-block;
    opacity:0;
    transform:translateY(18px);
  }
  .letter-ready .line:nth-of-type(1){animation:textFadeIn 1.5s forwards 1.0s;}
  .letter-ready .line:nth-of-type(2){animation:textFadeIn 1.5s forwards 2.8s;}
  .letter-ready .line:nth-of-type(3){animation:textFadeIn 1.5s forwards 4.6s;}
  .letter-ready .line:nth-of-type(4){animation:textFadeIn 1.5s forwards 6.4s;color:var(--warm);}

    color:var(--gold);

    opacity:0;

  .day-mark.show{opacity:1;}

  .day-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
    max-width:280px;
    margin-left:auto;
    margin-right:auto;

  .day-dots i{
    width:5px;height:5px;
    border-radius:50%;
    background:rgba(255,215,0,.75);
    box-shadow:0 0 6px rgba(255,215,0,.45);
    display:block;

    opacity:0;
    cursor:pointer;
    user-select:none;

    margin-right:auto;

  }
  .next-btn:hover{opacity:.95;background:rgba(255,255,255,.06);}
  .next-btn:focus-visible{outline:1px solid rgba(255,215,0,.5);opacity:.95;}

    background:rgba(0,0,0,.35);
  }

  #guestScreen{
    z-index:7;
    background:rgba(9,10,15,.72);
    backdrop-filter:blur(10px);

    width:min(880px, 90vw);
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:3;
  }

  .frame{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);

    width:100%;
    height:100%;
    border:0;

    margin-top:16px;
    font-size:1.1rem;
    letter-spacing:.04em;
    color:var(--warm);
    min-height:1.4em;
    text-align:center;
    opacity:.85;
  }

  .nav-btn{
    position:absolute;
    cursor:pointer;
    user-select:none;
    opacity:.7;
    padding:10px 14px;
    font-size:1.6rem;
    transition:opacity .2s;
  }
  .nav-btn:hover{opacity:1;}
  .back-btn{top:18px;left:16px;z-index:5;}
  .next-video-btn{right:22px;bottom:22px;font-size:2rem;z-index:5;}

  .float-comments{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;

  .float-comment{
    position:absolute;
    max-width:min(440px, 36vw);
    opacity:0;

    line-height:1.65;

  @keyframes commentRise{

  .guest-form{

    align-self:flex-end;

  }

  .guest-list{
    width:min(520px, 90vw);
    max-height:48vh;
    overflow:auto;
    text-align:left;
    padding:0 8px 40px;

  .guest-item{
    margin:0 0 1.55em;
    opacity:.78;

  .guest-item.today{
    opacity:1;
    color:var(--warm);
  }
  .guest-item time{
    display:block;
    font-size:.75rem;
    letter-spacing:.06em;
    opacity:.45;
    margin-bottom:.3em;
  }
  .guest-item p{
    margin:0;
    line-height:1.85;
    font-size:1.02rem;

  .corner-note{
    position:fixed;
    right:20px;
    bottom:20px;
    font-size:.85rem;
    opacity:0;
    z-index:9;
    pointer-events:none;
    transition:opacity 2s ease;
  }
  .corner-note.show{opacity:.62;}

  @keyframes drift{
    from{transform:translateY(0);}
    to{transform:translateY(-2000px);}
  }
  @keyframes textFadeIn{
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes breathe{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(5px);}
  }
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(-28deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(420px,230px) rotate(-28deg);}
  }

  @media (max-width:640px){
    .message-box{font-size:1.12rem;line-height:2.2;padding:12px 8px;}
    .moon{width:48px;height:48px;top:10%;right:10%;}
    .nav-btn{font-size:1.35rem;}
    .float-comment{font-size:.78rem;max-width:70vw;}
  }

  @media (prefers-reduced-motion:reduce){
    #stars-a,#stars-b,#stars-c,.shooting,.next-btn.show{animation:none;}
    .line{opacity:1;transform:none;}
    .letter-ready .line{animation:none;}
    .screen{transition:none;}
  }
</style>

<body>

<script>
/* 유튜브 주소 그대로 붙여넣으면 됩니다. 줄을 늘리면 영상이 늘어납니다. */
const videos = [
  {url:"https://www.youtube.com/watch?v=ekKnNTpm3Cs", memo:"죽지마"},
  {url:"https://www.youtube.com/watch?v=RohZ89_w93o", memo:"실패라고 생각하지마"},
  {url:"https://www.youtube.com/watch?v=cS-IiArGmcU", memo:"가족을 생각해"},

  {url:"https://www.youtube.com/watch?v=BzYnNdJhZQw", memo:"밤편지"},
  {url:"https://www.youtube.com/watch?v=Yg8B0z76qHE", memo:"혼자가 아니야"},
  {url:"https://www.youtube.com/watch?v=2-P-NIiLiQc", memo:"개화"},
  {url:"https://www.youtube.com/watch?v=vnS_jn2uibs", memo:"한 페이지"},
  {url:"https://www.youtube.com/watch?v=k4V3Mo61fJM", memo:"집으로"},
  {url:"https://www.youtube.com/watch?v=W4SXOQ7xFoo", memo:"안아줘"}
];

const DAYS_KEY = "svae-days";
const GUEST_KEY = "svae-guest-notes";
const BOOK_START = "2026-02-06";
const BOOK_DAYS = 21;
let WORDS = ["살기 좋다. 오늘은 특히.", "오늘 하루만 더.", "또 보자, 내일."];
let currentIndex = -1;
let starStyle;
let commentTimer = null;
let commentIdx = 0;

function parseWords(text){
  return String(text).split(/\n/).map(s => s.trim()).filter(s => s && !s.startsWith("#"));
}

function setWords(list){
  if(!list.length) return;
  WORDS = list;
  commentIdx = Math.floor(Math.random() * WORDS.length);
}

fetch("words.txt").then(r => {
  if(!r.ok) throw new Error(r.status);
  return r.text();
}).then(t => setWords(parseWords(t))).catch(() => {});

function todayKey(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function stayToday(){
  let days = [];
  try{ days = JSON.parse(localStorage.getItem(DAYS_KEY) || "[]"); }
  catch(e){ days = []; }
  if(!Array.isArray(days)) days = [];
  const t = todayKey();
  if(!days.includes(t)) days.push(t);
  days.sort();
  try{ localStorage.setItem(DAYS_KEY, JSON.stringify(days)); }
  catch(e){}
  return days;
}

function renderDays(days){
  const n = days.length;
  const mark = document.getElementById("dayMark");
  const dots = document.getElementById("dayDots");
  if(n <= 1){
    mark.textContent = "";
    dots.hidden = true;
    return;
  }
  mark.textContent = `이게 ${n}번째 하루입니다.`;
  dots.hidden = false;
  dots.innerHTML = "";
  const show = Math.min(n, 24);
  for(let i=0;i<show;i++){
    dots.appendChild(document.createElement("i"));
  }
}

function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

function notesForDay(key){
  const h = hashStr(key + ":svae-book");
  const count = (h % 2) + 1;
  const seen = new Set();
  const out = [];
  for(let i=0;i<count;i++){
    let idx = (h + i * 97) % WORDS.length;
    if(seen.has(idx)) idx = (idx + 1) % WORDS.length;
    seen.add(idx);
    const mins = 7 * 60 + ((h >>> (i * 7)) % (16 * 60));
    const hh = Math.floor(mins / 60);
    const mm = mins % 60;
    out.push({
      when: `${key.slice(0,4)}.${key.slice(5,7)}.${key.slice(8,10)}  ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`,
      text: WORDS[idx],
      today: key === todayKey()
    });
  }
  out.sort((a,b) => a.when < b.when ? 1 : -1);
  return out;
}

function buildBook(){
  const today = todayKey();
  const [ty,tm,td] = today.split("-").map(Number);
  const end = new Date(ty, tm-1, td);
  const [sy,sm,sd] = BOOK_START.split("-").map(Number);
  const start = new Date(sy, sm-1, sd);
  let from = new Date(end);
  from.setDate(from.getDate() - (BOOK_DAYS - 1));
  if(from < start) from = start;
  const items = [];
  for(let d = new Date(end); d >= from; d.setDate(d.getDate()-1)){
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    items.push(...notesForDay(key));
  }
  return items;
}

function renderBook(){
  const box = document.getElementById("guestList");
  box.innerHTML = "";
  const add = (n, mine) => {
    const art = document.createElement("article");
    art.className = "guest-item" + (n.today || mine ? " today" : "");
    const time = document.createElement("time");
    time.textContent = n.when;
    const p = document.createElement("p");
    p.textContent = n.text;
    art.appendChild(time);
    art.appendChild(p);
    box.appendChild(art);
  };
  loadGuests().forEach(n => add(n, true));
  buildBook().forEach(n => add(n, false));
}

function loadGuests(){
  try{
    const a = JSON.parse(localStorage.getItem(GUEST_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}

function saveGuests(list){
  try{ localStorage.setItem(GUEST_KEY, JSON.stringify(list.slice(0, 200))); }
  catch(e){}
}

function normBad(s){
  return String(s).toLowerCase().replace(/[\s._*\-·'"“”]/g,"");
}

function isBlocked(text){
  const n = normBad(text);
  const bad = [
    "시발","씨발","씨팔","시팔","ㅆㅂ","ㅅㅂ","tlqkf","tlqkf",
    "병신","븅신","지랄","wlfkf","qudtls","좆","좇","ㅈ같",
    "꺼져","닥쳐","개새","개소리","미친놈","미친년",
    "니애미","느금마","염병","존나","졸라",
    "fuck","shit","bitch","asshole",
    "죽어라","뒤져","자살해","같이죽","함께죽"
  ];
  return bad.some(w => n.includes(normBad(w)));
}

function hasLink(s){
  return /https?:\/\/|www\.|\.com\b|\.kr\b|bit\.ly/i.test(s);
}

function nowStamp(){
  const d = new Date();
  return todayKey().replace(/-/g,".") + "  " +
    String(d.getHours()).padStart(2,"0") + ":" +
    String(d.getMinutes()).padStart(2,"0");
}

function submitGuest(e){
  e.preventDefault();
  const hint = document.getElementById("guestHint");
  const body = document.getElementById("guestBody").value.trim();
  hint.textContent = "";
  if(body.length < 2){ hint.textContent = "조금 더 적어 주세요."; return; }
  if(isBlocked(body)){ hint.textContent = "그런 말은 남길 수 없어요."; return; }
  if(hasLink(body)){ hint.textContent = "주소는 남길 수 없어요."; return; }
  const all = loadGuests();
  const today = todayKey();
  if(all.filter(x => x.day === today).length >= 2){
    hint.textContent = "오늘은 두 줄이면 충분해요.";
    return;
  }
  if(all.some(x => x.text === body)){ hint.textContent = "같은 말이 이미 있어요."; return; }
  all.unshift({text: body, day: today, when: nowStamp()});
  saveGuests(all);
  document.getElementById("guestBody").value = "";
  renderBook();
}

function parseYoutube(input){
  const raw = String(input || "").trim();
  const out = {id:"", list:""};
  if(!raw) return out;
  if(/^[a-zA-Z0-9_-]{11}$/.test(raw)){
    out.id = raw;
    return out;
  }
  try{
    const u = new URL(raw);
    out.list = u.searchParams.get("list") || "";
    if(u.searchParams.get("v")) out.id = u.searchParams.get("v");
    else {
      const parts = u.pathname.split("/").filter(Boolean);
      if(u.hostname.replace(/^www\./,"") === "youtu.be") out.id = parts[0] || "";
      else if(parts[0]==="embed" && parts[1] && parts[1]!=="videoseries") out.id = parts[1];
      else if(parts[0]==="shorts" || parts[0]==="live") out.id = parts[1] || "";
    }
  }catch(e){}
  return out;
}

function pickRandom(){
  let i;
  do{
    i = Math.floor(Math.random()*videos.length);
  }while(i === currentIndex && videos.length > 1);
  currentIndex = i;
  return videos[i];
}

function play(v){
  const p = parseYoutube(v.url || v.id);
  const q = new URLSearchParams({autoplay:"1", rel:"0", modestbranding:"1"});
  let path = "";
  if(p.id){
    path = p.id;
    if(p.list) q.set("list", p.list);
  }else if(p.list){
    path = "videoseries";
    q.set("list", p.list);
  }else return;
  document.getElementById("videoPlayer").src =
    `https://www.youtube-nocookie.com/embed/${path}?${q}`;
  document.getElementById("videoMemo").textContent = v.memo || "";
}

function hideScreens(){
  document.getElementById("mainScreen").classList.remove("on");
  document.getElementById("videoScreen").classList.remove("on");
  document.getElementById("guestScreen").classList.remove("on");
}

function spawnComment(){
  const box = document.getElementById("floatComments");
  if(!box || !WORDS.length) return;
  const el = document.createElement("div");
  el.className = "float-comment";
  el.textContent = WORDS[commentIdx % WORDS.length];
  if(commentIdx % 2 === 0){
    el.style.left = (2 + Math.random()*14) + "%";
  }else{
    el.style.left = "auto";
    el.style.right = (2 + Math.random()*14) + "%";
    el.style.textAlign = "right";
  }
  el.style.bottom = (2 + Math.random()*22) + "%";
  el.style.fontSize = (0.68 + Math.random()*0.7).toFixed(2) + "rem";
  el.style.letterSpacing = ((Math.random()*0.12) - 0.03).toFixed(3) + "em";
  el.style.fontWeight = Math.random() < 0.25 ? "500" : "400";
  el.style.animationDuration = (10 + Math.random()*4) + "s";
  commentIdx++;
  box.appendChild(el);
  setTimeout(() => el.remove(), 16000);
}

function startSideComments(){
  stopSideComments();
  const mobile = window.innerWidth < 640;
  spawnComment();
  if(!mobile) spawnComment();
  commentTimer = setInterval(() => {
    spawnComment();
    if(!mobile) spawnComment();
  }, mobile ? 1500 : 900);
}

function stopSideComments(){
  clearInterval(commentTimer);
  commentTimer = null;
  const box = document.getElementById("floatComments");
  if(box) box.innerHTML = "";
}

function showVideo(){
  hideScreens();
  document.getElementById("videoScreen").classList.add("on");
  play(pickRandom());
  startSideComments();
}

function nextVideo(){
  play(pickRandom());
}

function showGuest(){
  document.getElementById("guestScreen").classList.add("on");
  renderBook();
}

function hideGuest(){
  document.getElementById("guestScreen").classList.remove("on");
}

function toggleGuest(){
  if(document.getElementById("guestScreen").classList.contains("on")) hideGuest();
  else showGuest();
}

function showMain(){
  stopSideComments();
  hideScreens();
  document.getElementById("mainScreen").classList.add("on");
  document.getElementById("videoPlayer").src = "";
}

function layerShadows(count, size){
  const w = Math.max(window.innerWidth, 320);
  let s = "";
  for(let i=0;i<count;i++){
    s += `${Math.random()*w}px ${Math.random()*2000}px 0 ${Math.random()*size}px rgba(255,255,255,${0.35+Math.random()*0.65}),`;
  }
  return s.slice(0,-1);
}

function createStars(){
  if(starStyle) starStyle.remove();
  starStyle = document.createElement("style");
  const a = layerShadows(140, 1.2);
  const b = layerShadows(90, 1.8);
  const c = layerShadows(50, 2.4);
  starStyle.textContent =
    `#stars-a,#stars-a:after{box-shadow:${a};}` +
    `#stars-b,#stars-b:after{box-shadow:${b};}` +
    `#stars-c,#stars-c:after{box-shadow:${c};}`;
  document.head.appendChild(starStyle);
}

function shootOnce(){
  const el = document.getElementById("shoot");
  el.classList.remove("go");
  el.style.top = (8 + Math.random()*36) + "%";
  el.style.left = (5 + Math.random()*60) + "%";
  void el.offsetWidth;
  el.classList.add("go");
}

function bindKeys(el, fn){
  el.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === " "){
      e.preventDefault();
      fn();
    }
  });
}

createStars();
window.addEventListener("resize", createStars);

const days = stayToday();
renderDays(days);

requestAnimationFrame(() => {
  document.getElementById("letter").classList.add("letter-ready");
});

const quiet = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const later = quiet ? 0 : 8200;
setTimeout(() => document.getElementById("nextBtn").classList.add("show"), later);
if(days.length > 1){
  setTimeout(() => document.getElementById("dayMark").classList.add("show"), quiet ? 0 : 9000);
}
setTimeout(() => {
  document.getElementById("sign").classList.add("show");
}, quiet ? 0 : 10400);

if(!quiet){
  setTimeout(shootOnce, 3500);
  setInterval(shootOnce, 14000);
}

bindKeys(document.getElementById("nextBtn"), showVideo);
document.querySelectorAll("#videoScreen .back-btn").forEach(el => bindKeys(el, showMain));
bindKeys(document.getElementById("guestBack"), hideGuest);
bindKeys(document.querySelector(".next-video-btn"), nextVideo);
document.getElementById("guestForm").addEventListener("submit", submitGuest);
</script>
