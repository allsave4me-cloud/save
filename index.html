<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>살고싶어</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com about:blank; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0f">
<meta name="description" content="당신이 오늘 마치려던 그 일, 딱 하루만 미뤄주실 수 있나요?">

<meta property="og:title" content="살고싶어">
<meta property="og:description" content="당신이 오늘 마치려던 그 일, 딱 하루만 미뤄주실 수 있나요?">
<meta property="og:url" content="https://xn--299a098autbi6d.com/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="살고싶어">
<meta name="twitter:description" content="당신이 오늘 마치려던 그 일, 딱 하루만 미뤄주실 수 있나요?">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<script src="app.js" defer></script>

<style>
  :root{
    --gold:#ffd700;
    --warm:#ffebd2;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:'Nanum Myeongjo', 'Nanum Gothic', serif;
    background:#090a0f;
    color:#fff;
    color-scheme:dark;
  }

  .visually-hidden{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% 115%, rgba(255,186,120,.16) 0%, transparent 55%),
      radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 72%);
  }

  .sky{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }

  .moon{
    position:fixed;
    top:11%;
    right:16%;
    width:64px;
    height:64px;
    border:0;
    padding:0;
    border-radius:50%;
    background:#f3ead2;
    opacity:.32;
    box-shadow:0 0 60px 18px rgba(255,240,210,.14);
    cursor:pointer;
    z-index:8;
  }
  .moon:hover{opacity:.5;}
  .moon:focus-visible{outline:1px solid rgba(255,235,210,.45);}

  .horizon{
    position:absolute;
    left:0;right:0;bottom:0;
    height:28%;
    background:linear-gradient(to top, rgba(255,176,110,.12), transparent);
    opacity:.7;
  }

  .stars{
    position:absolute;
    top:0;left:0;
    width:2px;height:2px;
    background:transparent;
    border-radius:50%;
  }
  #stars-a{animation:drift 80s linear infinite;}
  #stars-b{animation:drift 140s linear infinite;}
  #stars-c{animation:drift 220s linear infinite;}
  #stars-a:after,#stars-b:after,#stars-c:after{
    content:"";
    position:absolute;
    top:2000px;
    width:2px;height:2px;
    border-radius:50%;
  }

  .shooting{
    position:absolute;
    width:90px;height:1px;
    background:linear-gradient(90deg, rgba(255,255,255,.9), transparent);
    opacity:0;
    transform:rotate(-28deg);
    filter:drop-shadow(0 0 4px #fff);
  }
  .shooting.go{
    animation:shoot 1.1s ease-out forwards;
  }

  .screen{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:1;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 1.1s ease, visibility 1.1s;
  }
  .screen.on{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  .to-you{
    font-size:.78rem;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:rgba(255,235,210,.45);
    margin:0 0 18px;
    opacity:0;
    animation:textFadeIn 2s forwards .2s;
  }

  .message-box{
    text-align:center;
    line-height:2.4;
    font-size:1.35rem;
    padding:28px 20px 8px;
    max-width:90%;
    width:620px;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }

  .line{
    display:inline-block;
    opacity:0;
    transform:translateY(18px);
  }
  .letter-ready .line:nth-of-type(1){animation:textFadeIn 1.5s forwards 1.0s;}
  .letter-ready .line:nth-of-type(2){animation:textFadeIn 1.5s forwards 2.8s;}
  .letter-ready .line:nth-of-type(3){animation:textFadeIn 1.5s forwards 4.6s;}
  .letter-ready .line:nth-of-type(4){animation:textFadeIn 1.5s forwards 6.4s;color:var(--warm);}

  .highlight{
    color:var(--gold);
    text-shadow:0 0 10px rgba(255,215,0,.4);
  }

  .day-mark{
    margin-top:22px;
    font-size:.92rem;
    letter-spacing:.08em;
    color:rgba(255,235,210,.7);
    opacity:0;
    min-height:1.4em;
    margin-bottom:0;
    transition:opacity 1.6s ease;
  }
  .day-mark.show{opacity:1;}

  .day-dots{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    margin-top:10px;
    max-width:280px;
    margin-left:auto;
    margin-right:auto;
  }
  .day-dots span{
    width:5px;height:5px;
    border-radius:50%;
    background:rgba(255,215,0,.75);
    box-shadow:0 0 6px rgba(255,215,0,.45);
    display:block;
  }

  button.next-btn,
  button.nav-btn{
    color:inherit;
    background:transparent;
    border:0;
    font-family:inherit;
    line-height:1;
  }
  .next-btn{
    margin-top:28px;
    font-size:2rem;
    opacity:0;
    cursor:pointer;
    user-select:none;
    width:56px;height:56px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-left:auto;
    margin-right:auto;
    border-radius:50%;
    transition:opacity .4s, transform .3s, background .3s;
  }
  .next-btn.show{
    opacity:.55;
    animation:breathe 2.8s ease-in-out infinite;
  }
  .next-btn:hover{opacity:.95;background:rgba(255,255,255,.06);}
  .next-btn:focus-visible{outline:1px solid rgba(255,215,0,.5);opacity:.95;}

  #videoScreen{
    background:rgba(0,0,0,.35);
  }

  #guestScreen{
    z-index:7;
    background:rgba(9,10,15,.72);
    backdrop-filter:blur(10px);
    transition:opacity .45s ease, visibility .45s;
  }

  .video-stage{
    width:min(880px, 90vw);
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:3;
  }

  .frame{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
  }

  #videoPlayer{
    width:100%;
    height:100%;
    border:0;
  }

  #videoMemo{
    margin-top:16px;
    font-size:1.1rem;
    letter-spacing:.04em;
    color:var(--warm);
    min-height:1.4em;
    text-align:center;
    opacity:.85;
    font-style:normal;
  }

  .nav-btn{
    position:absolute;
    cursor:pointer;
    user-select:none;
    opacity:.7;
    padding:10px 14px;
    font-size:1.6rem;
    transition:opacity .2s;
  }
  .nav-btn:hover{opacity:1;}
  .nav-btn:focus-visible{outline:1px solid rgba(255,235,210,.45);}
  .back-btn{top:18px;left:16px;z-index:5;}
  .next-video-btn{right:22px;bottom:22px;font-size:2rem;z-index:5;}

  .float-comments{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:1;
  }
  .float-comment{
    position:absolute;
    margin:0;
    max-width:min(440px, 36vw);
    opacity:0;
    font-size:.88rem;
    line-height:1.65;
    color:rgba(255,235,210,.5);
    text-shadow:0 2px 16px rgba(0,0,0,.75);
    animation:commentRise 12s linear forwards;
    will-change:transform, opacity;
  }

  @keyframes commentRise{
    0%{opacity:0;transform:translate3d(0,0,0);}
    10%{opacity:.5;transform:translate3d(0,-10vh,0);}
    70%{opacity:.35;transform:translate3d(0,-70vh,0);}
    100%{opacity:0;transform:translate3d(0,-110vh,0);}
  }

  .guest-head{
    text-align:center;
    font-size:.95rem;
    font-weight:400;
    opacity:.7;
    margin:0 0 18px;
    line-height:1.8;
  }
  .guest-sub{
    display:block;
    margin-top:.45em;
    font-size:.82rem;
    opacity:.75;
    color:var(--warm);
  }

  .guest-form{
    width:min(520px, 90vw);
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:18px;
  }
  .guest-form input,
  .guest-form textarea{
    width:100%;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:var(--warm);
    font-family:inherit;
    font-size:.95rem;
    border-radius:10px;
    padding:10px 12px;
    resize:none;
    outline:none;
  }
  .guest-form button{
    align-self:flex-end;
    background:transparent;
    border:1px solid rgba(255,235,210,.28);
    color:var(--warm);
    font-family:inherit;
    font-size:.88rem;
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    opacity:.8;
  }
  .guest-form button:hover{opacity:1;}
  .guest-hint{
    min-height:1.2em;
    margin:0;
    font-size:.8rem;
    opacity:.65;
  }

  .guest-list{
    width:min(520px, 90vw);
    max-height:48vh;
    overflow:auto;
    text-align:left;
    padding:0 8px 40px;
  }
  .guest-item{
    margin:0 0 1.55em;
    opacity:.78;
  }
  .guest-item.today{
    opacity:1;
    color:var(--warm);
  }
  .guest-item time{
    display:block;
    font-size:.75rem;
    letter-spacing:.06em;
    opacity:.45;
    margin-bottom:.3em;
  }
  .guest-item p{
    margin:0;
    line-height:1.85;
    font-size:1.02rem;
  }

  .corner-note{
    position:fixed;
    right:20px;
    bottom:20px;
    font-size:.85rem;
    opacity:0;
    z-index:9;
    pointer-events:none;
    transition:opacity 2s ease;
  }
  .corner-note.show{opacity:.62;}

  @keyframes drift{
    from{transform:translateY(0);}
    to{transform:translateY(-2000px);}
  }
  @keyframes textFadeIn{
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes breathe{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(5px);}
  }
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(-28deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(420px,230px) rotate(-28deg);}
  }

  @media (max-width:640px){
    .message-box{font-size:1.12rem;line-height:2.2;padding:12px 8px;}
    .moon{width:48px;height:48px;top:10%;right:10%;}
    .nav-btn{font-size:1.35rem;}
    .float-comment{font-size:.78rem;max-width:70vw;}
  }

  @media (prefers-reduced-motion:reduce){
    #stars-a,#stars-b,#stars-c,.shooting,.next-btn.show{animation:none;}
    .line{opacity:1;transform:none;}
    .letter-ready .line{animation:none;}
    .screen{transition:none;}
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div id="stars-a" class="stars"></div>
  <div id="stars-b" class="stars"></div>
  <div id="stars-c" class="stars"></div>
  <div class="horizon"></div>
  <div id="shoot" class="shooting"></div>
</div>

<main>
<section id="mainScreen" class="screen on" aria-labelledby="pageTitle">
  <article class="message-box" id="letter">
    <p class="to-you">To You</p>
    <h1 id="pageTitle" class="visually-hidden">살고싶어</h1>
    <span class="line">당신이 오늘 마치려던 그 일,</span><br>
    <span class="line">딱 <span class="highlight">하루만</span> 미뤄주실 수 있나요?</span><br><br>

    <span class="line">그리고 또 하루, 또 하루...<br>
    그렇게 버텨낸 시간들이 모이면,</span><br><br>

    <span class="line">언젠가 다시 웃을 이유 하나쯤은<br>
    반드시 당신을 찾아올 테니까요.</span>

    <p class="day-mark" id="dayMark"></p>
    <div class="day-dots" id="dayDots" hidden></div>

    <button type="button" class="next-btn" id="nextBtn" aria-label="이어서">&gt;</button>
  </article>
</section>

<section id="videoScreen" class="screen" aria-label="남겨둔 노래" aria-hidden="true" inert>
  <button type="button" class="nav-btn back-btn" id="videoBack" aria-label="돌아가기">←</button>

  <aside class="float-comments" id="floatComments" aria-hidden="true"></aside>

  <figure class="video-stage">
    <div class="frame">
      <iframe id="videoPlayer"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        title="남겨둔 노래"></iframe>
    </div>
    <figcaption id="videoMemo"></figcaption>
  </figure>

  <button type="button" class="nav-btn next-video-btn" id="nextVideoBtn" aria-label="다음 노래">&gt;</button>
</section>

<section id="guestScreen" class="screen" role="dialog" aria-modal="true" aria-labelledby="guestTitle" aria-hidden="true" inert>
  <button type="button" class="nav-btn back-btn" id="guestBack" aria-label="닫기">←</button>
  <header class="guest-head" id="guestTitle">여기는 달 뒤에 숨겨 둔, 너만의 밤입니다.<span class="guest-sub">네가 적는 한 줄은, 너만 아는 일기장에 남습니다.</span></header>
  <form class="guest-form" id="guestForm" method="post" action="#" autocomplete="off">
    <label class="visually-hidden" for="guestBody">좋은 말 한 줄</label>
    <textarea id="guestBody" name="note" maxlength="80" rows="2" autocomplete="off" placeholder="다음에 볼때 더 나은 삶은 위한 말을 적어봐! 너의 생각!"></textarea>
    <button type="submit">남기기</button>
    <p class="guest-hint" id="guestHint" role="status" aria-live="polite"></p>
  </form>
  <section class="guest-list" id="guestList" aria-label="남겨 둔 말"></section>
</section>
</main>

<button type="button" class="moon" id="moonBtn" aria-label="달 뒤의 일기장"></button>

<footer class="corner-note" id="sign">
  고마워, 그리고 감사해 미안해 또 보자
</footer>

</body>
</html>
